<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock-paper-scissors game</title>
  <link rel="stylesheet" href="rock-paper-scissors.css">
  <style>

  </style>
</head>

<body>
  <h1>Rock Paper Scissors</h1>
  <div class="container">
    <p class="result style-p"></p>
    <p class="moves style-p "></p>
    <p class="score style-p"></p>
    <div class="action">
      <button onclick="playGame('rock')"><img class="action-icon" src="assets/rock.png"></button>

      <button onclick="playGame('paper')"><img class="action-icon" src="assets/paper.png"></button>

      <button onclick="playGame('scissors')"><img class="action-icon" src="assets/scissors.png"></button>
    </div>

   
    <button class="reset-btn" onclick="reset()">Reset</button>
    
  </div>
   


  <script src="rock-paper-scissors.js"></script>
</body>

</html>
