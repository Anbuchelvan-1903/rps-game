<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock-paper-scissors game</title>
  <link rel="stylesheet" href="rock-paper-scissors.css">
  <style>

  </style>
</head>

<body>
  <div class="container">
    <h1>Rock Paper Scissors</h1>
    <p title="Results shows here" class="result style-p"></p>
    <p title="Moves shows here" class="moves style-p "></p>
    <p title="Scores shows here" class="score style-p"></p>
    
    <div class="action">
      <button title="Rock" class="js-rockBtn">
        <img class="action-icon " src="assets/rock.png">
      </button>

      <button title="Paper" class="js-paperBtn">
        <img class="action-icon" src="assets/paper.png">
      </button>

      <button title="Scissors" class="js-scissorsBtn">
        <img class="action-icon" src="assets/scissors.png">
      </button>
    </div>

    <div class="fn-btns">
      <button title="Reset" class="reset-btn">Reset</button>
      <button title="Autoplay" class="autoplay-btn">Autoplay</button>
    </div>
    
    
    

  </div>



  <script src="rock-paper-scissors.js"></script>
</body>

</html>
